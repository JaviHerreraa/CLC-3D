<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Almacén 3D - CLC</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #121212; font-family: Arial, sans-serif; color: #ffffff; }
        #canvas-container { width: 100vw; height: 100vh; }
        .badge-top { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.85); padding: 10px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; border: 1px solid #333; z-index: 10; }
        
        .control-panel { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 8px; width: 240px; border: 1px solid #333; z-index: 10; }
        .control-panel label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #ccc; }
        .control-panel select { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; margin-bottom: 12px; cursor: pointer; font-size: 13px; font-family: Arial, sans-serif; }
        
        /* Filtro de pasillos estilizado exactamente igual al select */
        .filter-dropdown { position: relative; margin-bottom: 12px; }
        .filter-btn { 
            width: 100%; 
            padding: 8px; 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 4px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 13px; 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .filter-btn:after {
            content: "▼";
            font-size: 10px;
            color: #fff;
        }
        .filter-content { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 100%; 
            background: #222; 
            border: 1px solid #444; 
            border-radius: 4px; 
            width: 100%; 
            max-height: 180px; 
            overflow-y: auto; 
            padding: 8px; 
            z-index: 20; 
            box-sizing: border-box; 
            margin-top: 4px; 
        }
        .filter-content.show { display: block; }
        .filter-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; cursor: pointer; color: #fff; }
        .filter-item input { margin-right: 8px; cursor: pointer; accent-color: #3399ff; }

        .legend-panel { position: absolute; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 8px; border: 1px solid #333; width: 180px; z-index: 10; }
        .legend-panel h4 { margin: 0 0 10px 0; font-size: 12px; color: #ccc; }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .color-box { width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; }
        
        /* Estilo para el Tooltip flotante */
        #tooltip {
            position: absolute;
            display: none;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ffffff;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            line-height: 1.5;
        }
        #tooltip b {
            color: #f39c12;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="badge-top" id="counter-badge">CLC (3776 ubicaciones creadas)</div>

    <div class="control-panel">
        <label>Modo de Visualización:</label>
        <select id="modeSelect">
            <option value="ubicacion">Por Tipo de ubicación</option>
            <option value="estado">Por Estado (Libre/Ocupado)</option>
            <option value="almacen">Por Tipo de almacén</option>
        </select>

        <label>Filtrar Pasillos:</label>
        <div class="filter-dropdown">
            <button class="filter-btn" id="filterBtn">Seleccionar Pasillos</button>
            <div class="filter-content" id="filterContent">
                <!-- Checkboxes generados dinámicamente -->
            </div>
        </div>
    </div>

    <div class="legend-panel" id="legend-container">
        <h4>Referencias:</h4>
        <div class="legend-item"><div class="color-box" style="background: #3399ff;"></div> R1</div>
        <div class="legend-item"><div class="color-box" style="background: #9933cc;"></div> R2</div>
        <div class="legend-item"><div class="color-box" style="background: #ff3333;"></div> R3</div>
        <div class="legend-item"><div class="color-box" style="background: #00b894;"></div> R4</div>
    </div>

    <div id="tooltip"></div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121212);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-12, 10, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(-15, 30, 20);
        scene.add(dirLight);

        // Suelo del almacén ampliado y desplazado para centrar las estructuras
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(105, 70),
            new THREE.MeshStandardMaterial({ color: 0x1d3557, roughness: 0.7 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(-47, -1.6, -25);
        scene.add(floor);

        // --- SECTOR UBICACIÓN PISO ---
        const sectorGeo = new THREE.PlaneGeometry(25, 5); // Ancho y alto del sector (modifica los números a tu gusto)
        const sectorMat = new THREE.MeshStandardMaterial({ 
            color: 0xf1c40f, // Color en hexadecimal (ej. Amarillo: 0xf1c40f, Rojo: 0xe74c3c, etc.)
            roughness: 0.5,
            side: THREE.DoubleSide 
        });
        const sectorMesh = new THREE.Mesh(sectorGeo, sectorMat);
        sectorMesh.rotation.x = -Math.PI / 2; // Lo rota para que quede horizontal sobre el suelo
        sectorMesh.position.set(-15, -1.58, -55); // Coordenadas X, Y, Z para ubicarlo en el almacén

        sectorMesh.userData = {
            nombre_ubi: "PISO",
            estado: "Ocupado",
            tipo_almacen: "PISO",
            tipo_ubicacion: "P1"
        };  
        
        scene.add(sectorMesh); 

        // --- SECTOR INGRESOS ---
        const sectorGeo2 = new THREE.PlaneGeometry(30, 15); // [1] Ancho y Alto del nuevo sector
        const sectorMat2 = new THREE.MeshStandardMaterial({

        sectorMesh2.position.set(-56, -1.58, -50); // [3] Coordenadas X, Y, Z para ubicarlo donde prefieras en el almacén

        sectorMesh3.userData = {

        scene.add(sectorMesh3);

        // --- TEXTO FIJO PARA SECTOR PREPARADO ---

        textCanvas3.width = 1024;

        const textCtx3 = textCanvas3.getContext('2d');
        
        textCtx3.fillStyle = '#000000'; // Color del texto
        textCtx3.font = 'bold 32px Arial'; 
        textCtx3.textAlign = 'center';
        textCtx3.textBaseline = 'middle';
        textCtx3.fillText('SECTOR DE PREPARADO', 512, 64); // Texto que mostrará

        const textTexture3 = new THREE.CanvasTexture(textCanvas3);
        const textMat3 = new THREE.MeshBasicMaterial({ map: textTexture3, transparent: true });
        
        const textGeo3 = new THREE.PlaneGeometry(16, 4); 
        const textMesh3 = new THREE.Mesh(textGeo3, textMat3);
        
        textMesh3.rotation.x = -Math.PI / 2;
        textMesh3.position.set(-67, -1.55, -2); // Debe coincidir con la posición X y Z de sectorMesh3

        scene.add(textMesh3);

        // --- SECTOR EXPEDICIÓN ---
                const sectorGeo4 = new THREE.PlaneGeometry(15, 13); // Ancho y Alto del nuevo sector
                const sectorMat4 = new THREE.MeshStandardMaterial({ 
                    color: 0x2ecc71, // Color en hexadecimal (Ej. Verde: 0x2ecc71, cámbialo si prefieres otro)
                    roughness: 0.5,

                });
                const sectorMesh4 = new THREE.Mesh(sectorGeo4, sectorMat4);
                sectorMesh4.rotation.x = -Math.PI / 2; // Lo rota para que quede horizontal sobre el suelo
                sectorMesh4.position.set(-87, -1.58, -15); // Coordenadas X, Y, Z (Modifica X o Z según dónde quieras ubicarlo respecto al de ingresos)
        
                sectorMesh4.userData = {

                scene.add(sectorMesh4);

                scene.add(textMesh4);
                
        // --- SECTOR ALMACÉN ---
                const sectorGeo5 = new THREE.PlaneGeometry(15, 13); // Ancho y Alto del nuevo sector

                const sectorMesh5 = new THREE.Mesh(sectorGeo5, sectorMat5);

                textCanvas5.width = 1024;

                const textCtx5 = textCanvas5.getContext('2d');
                
                textCtx5.fillStyle = '#000000'; // Color del texto

                textMesh5.rotation.x = -Math.PI / 2;
                textMesh5.position.set(-87, -1.55, -29); // Debe coincidir con la posición X y Z de sectorMesh3
                
                scene.add(textMesh5); 
        
        // --- SECTOR DESPACHO ---
                const sectorGeo6 = new THREE.PlaneGeometry(15, 10); // Ancho y Alto del nuevo sector
                const sectorMat6 = new THREE.MeshStandardMaterial({ 
                    color: 0x2ecc71, // Color en hexadecimal (Ej. Verde: 0x2ecc71, cámbialo si prefieres otro)

                sectorMesh6.rotation.x = -Math.PI / 2; // Lo rota para que quede horizontal sobre el suelo
                sectorMesh6.position.set(-87, -1.58, -1); // Coordenadas X, Y, Z (Modifica X o Z según dónde quieras ubicarlo respecto al de ingresos)

                    estado: "Ocupado",

                };  
        
                scene.add(sectorMesh6);
                        
                // --- TEXTO FIJO PARA SECTOR DESPACHO ---

                textCanvas6.width = 1024;  
                textCanvas6.height = 128;

                textCtx6.fillStyle = '#000000'; // Color del texto
                textCtx6.font = 'bold 32px Arial'; 
                textCtx6.textAlign = 'center';
                textCtx6.textBaseline = 'middle';
                textCtx6.fillText('SECTOR DE DESPACHO', 512, 64); // Texto que mostrará
        
                const textTexture6 = new THREE.CanvasTexture(textCanvas6);
                const textMat6 = new THREE.MeshBasicMaterial({ map: textTexture6, transparent: true });
                
                const textGeo6 = new THREE.PlaneGeometry(16, 4);

                textMesh6.rotation.x = -Math.PI / 2;
                textMesh6.position.set(-87, -1.55, -1); // Debe coincidir con la posición X y Z de sectorMesh3
                
                scene.add(textMesh6); 

        // --- 1. DEFINICIÓN DE LA TEXTURA Y GEOMETRÍA DE LA FLECHA (Primero) ---
        const arrowCanvas = document.createElement('canvas');
        arrowCanvas.width = 128;
        arrowCanvas.height = 128;
        const arrowCtx = arrowCanvas.getContext('2d');
        
        arrowCtx.fillStyle = 'rgba(0, 0, 0, 0)'; // Fondo transparente
        arrowCtx.fillRect(0, 0, 128, 128);
        
        arrowCtx.fillStyle = '#000000'; // Color de la flecha
        arrowCtx.beginPath();
        arrowCtx.moveTo(64, 20);   // Punta
        arrowCtx.lineTo(100, 80);  // Esquina derecha
        arrowCtx.lineTo(76, 80);   // Base derecha
        arrowCtx.lineTo(76, 110);  // Cuerpo abajo derecha
        arrowCtx.lineTo(52, 110);  // Cuerpo abajo izquierda
        arrowCtx.lineTo(52, 80);   // Base izquierda
        arrowCtx.lineTo(28, 80);   // Esquina izquierda
        arrowCtx.closePath();
        arrowCtx.fill();

        const arrowTexture = new THREE.CanvasTexture(arrowCanvas);
        const arrowMat = new THREE.MeshBasicMaterial({ 
            map: arrowTexture, 
            transparent: true,
            side: THREE.DoubleSide 
        });
        const arrowGeo = new THREE.PlaneGeometry(2.5, 2.5);


        // --- 2. PORTÓN DE SALIDA 2 Y SU FLECHA ---
        const portonGeoIn = new THREE.PlaneGeometry(2, 10); 
        const portonMatIn = new THREE.MeshStandardMaterial({ 
            color: 0xE7A23C, 
            roughness: 0.4,
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide 
        });
        const portonMeshIn = new THREE.Mesh(portonGeoIn, portonMatIn);
        portonMeshIn.rotation.x = -Math.PI / 2; 
        portonMeshIn.position.set(-97, -1.57, -1); // Coordenadas del ingreso

        portonMeshIn.userData = {
            nombre_ubi: "PORTÓN DE INGRESO",
            estado: "Activo",
            tipo_almacen: "ACCESO",
            tipo_ubicacion: "PORTON"
        };  
        scene.add(portonMeshIn);

        const arrowMeshIn = new THREE.Mesh(arrowGeo, arrowMat);
        arrowMeshIn.rotation.x = -Math.PI / 2;
        arrowMeshIn.rotation.z = Math.PI / 2; // Rota la flecha según la dirección de entrada
        arrowMeshIn.position.set(-97, -1.55, -1); // Misma posición X y Z que el portón de ingreso
        scene.add(arrowMeshIn);

        portonMeshOut.rotation.x = -Math.PI / 2;

        portonMeshOut.userData = {

        scene.add(portonMeshOut);

        arrowMeshOut.rotation.x = -Math.PI / 2;
        arrowMeshOut.rotation.z = Math.PI; // Ajusta si necesitas girarla hacia afuera

        scene.add(arrowMeshOut);

        // --- 2. PORTÓN DE INGRESOS Y SU FLECHA ---
        const portonGeoIn1 = new THREE.PlaneGeometry(10, 2); 
        const portonMatIn1 = new THREE.MeshStandardMaterial({ 
            color: 0xE7A23C,

        const portonMeshIn1 = new THREE.Mesh(portonGeoIn1, portonMatIn1);
        portonMeshIn1.rotation.x = -Math.PI / 2; 
        portonMeshIn1.position.set(-56, -1.57, -59); // Coordenadas del ingreso

        portonMeshIn1.userData = {
            nombre_ubi: "PORTÓN DE INGRESO",
            estado: "Activo",
            tipo_almacen: "ACCESO",
            tipo_ubicacion: "PORTON"
        };  
        scene.add(portonMeshIn1);

        const arrowMeshIn1 = new THREE.Mesh(arrowGeo, arrowMat);
        arrowMeshIn1.rotation.x = -Math.PI / 2;
        arrowMeshIn1.rotation.z = Math.PI; // Rota la flecha según la dirección de entrada

            x += -82.0; // Ajusta este número (positivo o negativo) según la distancia que necesites moverlo
        }

        if (pasillo === 51) { // Cambia el 1 por el número del pasillo que corresponda si es otro
            x += -76.0; // Ajusta este número (positivo o negativo) según la distancia que necesites moverlo
        }

        if (pasillo === 20) { // Cambia el 1 por el número del pasillo que corresponda si es otro
            x += -30.0; // Ajusta este número (positivo o negativo) según la distancia que necesites moverlo
        }

            return x;
        }

        function calcularPosY(pasillo, columna, nivel) {
            let posY = -1.1; 
            for (let n = 1; n < nivel; n++) {
                let confNiv = getNichoConfig(pasillo, columna, n);
                posY += confNiv.alto;
            }
            let confActual = getNichoConfig(pasillo, columna, nivel);
            return posY + (confActual.alto / 2);
        }

        function getPosZ(pasillo) {
            if (pasillo === 1) return 4.5;   // Pasillo 1 (espacio de picking amplio)
            if (pasillo === 2) return 0.0;   // Pasillo 2 (-4.5)
            if (pasillo === 3) return -1.2;  // Pasillo 3 (-1.2)
            if (pasillo === 4) return -5.7;  // Pasillo 4 (-4.5)
            if (pasillo === 5) return -6.9;  // Pasillo 5 (-1.2)
            if (pasillo === 6) return -11.4;  // Pasillo 6 (-4.5)
            if (pasillo === 7) return -12.6;  // Pasillo 7 (-1.2)
            if (pasillo === 8) return -17.1;  // Pasillo 8 (-4.5)
            if (pasillo === 9) return -18.3;  // Pasillo 9 (-1.2)
            if (pasillo === 10) return -22.8;  // Pasillo 10 (-4.5)
            if (pasillo === 11) return -24;  // Pasillo 11 (-1.2)
            if (pasillo === 12) return -28.5;  // Pasillo 12 (-4.5)
            if (pasillo === 13) return -29.7;  // Pasillo 13 (-1.2)
            if (pasillo === 14) return -34.2;  // Pasillo 14 (-4.5)
            if (pasillo === 15) return -35.4;  // Pasillo 15 (-1.2)
            if (pasillo === 16) return -39.9;  // Pasillo 16 (-4.5)
            if (pasillo === 17) return -41.1;  // Pasillo 17 (-1.2)
            if (pasillo === 18) return -45.6;  // Pasillo 18 (-4.5)
            if (pasillo === 19) return -46.8;  // Pasillo 18 (-1.2)
            if (pasillo === 50) return -37.0;  // Pasillo 18 (-1.2)
            if (pasillo === 51) return -39.7;  // Pasillo 18 (-1.2)
            if (pasillo === 52) return -41.7;  // Pasillo 18 (-1.2)
            if (pasillo === 20) return -57;  // Pasillo 18 (-1.2)

            return -1.8 - ((pasillo - 3) * 5.0); 
        }

        function crearCartelPasillo(numero, posX, posY, posZ, esDerecho = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ff6161';
            ctx.fillRect(0, 0, 128, 128);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(0, 0, 128, 128);

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 72px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(numero.toString(), 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const badgeMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const badgeGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const mesh = new THREE.Mesh(badgeGeo, badgeMat);
            
            mesh.position.set(posX, posY, posZ);
            mesh.rotation.y = Math.PI / 2;
            
            if (esDerecho) {
                mesh.scale.x = -1;
            }
            
            return mesh;
        }

        const racksMap = {};
        rawData.forEach(item => {
            const key = item.pasillo + "-" + item.columna;
            if (!racksMap[key]) {
                racksMap[key] = { pasillo: item.pasillo, columna: item.columna, niveles: new Set() };
            }
            racksMap[key].niveles.add(item.nivel);
        });

        const columnasPorPasillo = {};
        Object.values(racksMap).forEach(rack => {
            if (!columnasPorPasillo[rack.pasillo]) columnasPorPasillo[rack.pasillo] = [];
            columnasPorPasillo[rack.pasillo].push(rack);
        });

        const pasilloGroups = {};

        Object.keys(columnasPorPasillo).forEach(pasilloKey => {
            const pasilloRacks = columnasPorPasillo[pasilloKey];
            pasilloRacks.sort((a, b) => a.columna - b.columna);

            const pasilloNum = parseInt(pasilloKey);
            const pasilloGroup = new THREE.Group();
            pasilloGroup.userData = { pasillo: pasilloNum };

            const minCol = pasilloRacks[0].columna;
            const maxCol = pasilloRacks[pasilloRacks.length - 1].columna;
            
            const posZ = getPosZ(pasilloNum);
            const fixedDepth = 0.85;

            let alturaTotalPasillo = 0;
            pasilloRacks.forEach(rack => {
                let altRack = 0;
                rack.niveles.forEach(n => {
                    altRack += getNichoConfig(rack.pasillo, rack.columna, n).alto;
                });
                if (altRack > alturaTotalPasillo) alturaTotalPasillo = altRack;
            });

            const uprightGeo = new THREE.BoxGeometry(0.06, alturaTotalPasillo, 0.06);
            const uprightY = -1.1 + (alturaTotalPasillo / 2);

            // Conjunto para evitar duplicar parantes en las posiciones de las columnas
            const columnasParantes = new Set();
            pasilloRacks.forEach(rack => {
                const col = rack.columna;
                if ((pasilloNum === 2 || pasilloNum === 3) && col >= 20) {
                    if (col % 2 === 0 && col <= maxCol) {
                        columnasParantes.add(col);
                    }
                } else {
                    if (col % 2 !== 0 && col <= maxCol) {
                        columnasParantes.add(col);
                    }
                }
            });

            // Incluir extremos izquierdo y derecho finales
            columnasParantes.add(minCol);
            columnasParantes.add(maxCol + 1);

            // Dibujar los parantes en las posiciones calculadas
            columnasParantes.forEach(col => {
                const uprightX = getColLeft(pasilloNum, col);
                
                const fl = new THREE.Mesh(uprightGeo, matUpright);
                fl.position.set(uprightX, uprightY, posZ + fixedDepth / 2);
                pasilloGroup.add(fl);

                const bl = new THREE.Mesh(uprightGeo, matUpright);
                bl.position.set(uprightX, uprightY, posZ - fixedDepth / 2);
                pasilloGroup.add(bl);
            });

            const paranteIzqX = getColLeft(pasilloNum, minCol);
            const paranteDerX = getColLeft(pasilloNum, maxCol + 1);
            const cartelY = 4.8; 
            
            const cartelIzq = crearCartelPasillo(pasilloNum === 50 ? 15 : (pasilloNum === 51 ? 16 : (pasilloNum === 52 ? 'EX' : pasilloNum)), paranteIzqX, cartelY, posZ, false);
            pasilloGroup.add(cartelIzq);

            const cartelDer = crearCartelPasillo(pasilloNum === 50 ? 15 : (pasilloNum === 51 ? 16 : (pasilloNum === 52 ? 'EX' : pasilloNum)), paranteDerX, cartelY, posZ, true);
            pasilloGroup.add(cartelDer);

            pasilloRacks.forEach(rack => {
                if (rack.pasillo === 14 && (rack.columna === 25 || rack.columna === 37)) {
                    return;
                }

                const confNiv1 = getNichoConfig(rack.pasillo, rack.columna, 1);
                const anchoNicho = confNiv1.ancho;
                const posX = getColLeft(rack.pasillo, rack.columna) - (anchoNicho / 2);

                rack.niveles.forEach(nivel => {
                    if (nivel > 1) {
                        let posYBaseNicho = calcularPosY(rack.pasillo, rack.columna, nivel);
                        let confActual = getNichoConfig(rack.pasillo, rack.columna, nivel);
                        let palletBaseY = posYBaseNicho - (confActual.alto / 2);
                        let beamY = palletBaseY - 0.025;
                        
                        const beamGeo = new THREE.BoxGeometry(anchoNicho, 0.05, 0.05);

                        const frontBeam = new THREE.Mesh(beamGeo, matBeam);
                        frontBeam.position.set(posX, beamY, posZ + fixedDepth / 2);
                        pasilloGroup.add(frontBeam);

                        const backBeam = new THREE.Mesh(beamGeo, matBeam);
                        backBeam.position.set(posX, beamY, posZ - fixedDepth / 2);
                        pasilloGroup.add(backBeam);
                    }
                });
            });

            if (pasilloNum === 51) {
                pasilloGroup.rotation.y = Math.PI / 2; // Gira 90 grados (en radianes)
                // Opcional: Si al girar necesitas ajustar su posición X o Z, puedes hacerlo aquí:
                pasilloGroup.position.x -= 33; 
                pasilloGroup.position.z -= 121.47;
            }

            if (pasilloNum === 52) {
                pasilloGroup.rotation.y = Math.PI / 2; // Gira 90 grados (en radianes)
                // Opcional: Si al girar necesitas ajustar su posición X o Z, puedes hacerlo aquí:
                pasilloGroup.position.x -= 55; 
                pasilloGroup.position.z -= 21.47;
            }

            

            pasilloGroups[pasilloNum] = pasilloGroup;
            mainGroup.add(pasilloGroup);
        });

        let rackMeshes = [];

        function getColor(item, mode) {
            if (mode === 'ubicacion') {
                if (item.tipo_ubicacion === 'R1') return 0x3399ff;
                if (item.tipo_ubicacion === 'R2') return 0x9933cc;
                if (item.tipo_ubicacion === 'R3') return 0xff3333;
                if (item.tipo_ubicacion === 'R4') return 0x00b894;
            } else if (mode === 'estado') {
                if (item.estado === 'Ocupado') return 0xa66e36;
                if (item.estado === 'Libre') return 0x28a745;

            } else if (mode === 'almacen') {
                if (item.tipo_almacen === 'PICK') return 0xffc107; // Amarillo
                if (item.tipo_almacen === 'REAP') return 0x17a2b8; // Celeste
                if (item.tipo_almacen === 'EST1') return 0xe74c3c; // Rojo
                if (item.tipo_almacen === 'PISO') return 0x2ecc71; // Verde
                if (item.tipo_almacen === 'PLAY') return 0x9b59b6; // Morado
                if (item.tipo_almacen === 'GRL1') return 0xe67e22; // Naranja
                if (item.tipo_almacen === 'GRL2') return 0xa85913; // Azul oscuro
                if (item.tipo_almacen === 'GRL3') return 0x15a387; // Turquesa
                if (item.tipo_almacen === 'SCRA') return 0x95a5a6; // Gris
            }
            return 0x3399ff;
        }

        const nichosData = {};
        rawData.forEach(item => {
            if (item.estado.toLowerCase() !== 'bloqueado') {
                const key = item.pasillo + "-" + item.columna + "-" + item.nivel;
                if (!nichosData[key]) nichosData[key] = [];
                nichosData[key].push(item);
            }
        });

        rawData.forEach(item => {
            if (item.estado.toLowerCase() === 'bloqueado') return;

            const confNiv1 = getNichoConfig(item.pasillo, item.columna, 1);
            const anchoNicho = confNiv1.ancho;
            const leftEdge = getColLeft(item.pasillo, item.columna);
            const centroNichoX = leftEdge - (anchoNicho / 2);
            const posZ = getPosZ(item.pasillo);

            let w = 0.95, h = 0.75, d = 0.8;
            let posX = centroNichoX;

            if (item.tipo_ubicacion === 'R2') {
                w = 3.0; h = 1.70; d = 1.0;
                posX = centroNichoX - (anchoNicho / 2); 
            } else if (item.tipo_ubicacion === 'R1') {
                w = 1.2; h = 1.5; d = 1.0;
                const keyNicho = item.pasillo + "-" + item.columna + "-" + item.nivel;
                const itemsEnNicho = nichosData[keyNicho];
                if (itemsEnNicho && itemsEnNicho.length >= 2) {
                    itemsEnNicho.sort((a, b) => a.codigo.localeCompare(b.codigo));
                    const indexInNicho = itemsEnNicho.findIndex(i => i.codigo === item.codigo);
                    const offset = anchoNicho / 4;
                    posX = centroNichoX + (indexInNicho === 0 ? offset : -offset);
                } else {
                    posX = centroNichoX;
                }
            } else if (item.tipo_ubicacion === 'R3') {
                w = 1.20; h = 2.9; d = 1.0;
                posX = centroNichoX;
            } else if (item.tipo_ubicacion === 'R4') {
                w = (anchoNicho / 3) - 0.08;
                h = 0.50;
                d = 0.70;

                let subIdx = 0;
                if (item.sububicacion === 'A') subIdx = 0;
                else if (item.sububicacion === 'B') subIdx = 1;
                else if (item.sububicacion === 'C') subIdx = 2;
                else {
                    const keyNicho = item.pasillo + "-" + item.columna + "-" + item.nivel;
                    const itemsEnNicho = nichosData[keyNicho] || [];
                    itemsEnNicho.sort((a, b) => a.codigo.localeCompare(b.codigo));
                    subIdx = itemsEnNicho.findIndex(i => i.codigo === item.codigo);
                    if (subIdx < 0) subIdx = 0;
                }

                const tercio = anchoNicho / 3;
                const puntoIzquierdaNicho = centroNichoX - (anchoNicho / 2);
                posX = puntoIzquierdaNicho + (tercio * subIdx) + (tercio / 2);
            }

            const geom = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: getColor(item, 'ubicacion'), roughness: 0.3 });
            const mesh = new THREE.Mesh(geom, mat);

            const posYBaseNicho = calcularPosY(item.pasillo, item.columna, item.nivel);
            const confActual = getNichoConfig(item.pasillo, item.columna, item.nivel);
            const posY = (posYBaseNicho - (confActual.alto / 2)) + (h / 2);

            mesh.position.set(posX, posY, posZ);
            mesh.userData = item;
            
            if (pasilloGroups[item.pasillo]) {
                pasilloGroups[item.pasillo].add(mesh);
            } else {
                scene.add(mesh);
            }

            rackMeshes.push({ mesh, item, pasillo: item.pasillo });
        });

        // Generar dinámicamente los checkboxes en el menú desplegable de pasillos
        const filterContent = document.getElementById('filterContent');
        const pasillosDisponibles = Object.keys(pasilloGroups).map(Number).sort((a, b) => a - b);

        pasillosDisponibles.forEach(pasilloNum => {
            const label = document.createElement('label');
            label.className = 'filter-item';
            label.innerHTML = `<input type="checkbox" value="${pasilloNum}" checked> Pasillo ${pasilloNum}`;
            filterContent.appendChild(label);
        });

        const filterBtn = document.getElementById('filterBtn');
        filterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            filterContent.classList.toggle('show');
        });

        window.addEventListener('click', () => {
            filterContent.classList.remove('show');
        });

        filterContent.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        const checkboxes = filterContent.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(chk => {
            chk.addEventListener('change', () => {
                const pasilloVal = parseInt(chk.value);
                const group = pasilloGroups[pasilloVal];
                if (group) {
                    group.visible = chk.checked;
                }
            });
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const visibleMeshes = rackMeshes
                .filter(obj => pasilloGroups[obj.pasillo] && pasilloGroups[obj.pasillo].visible)
                .map(obj => obj.mesh);

            visibleMeshes.push(sectorMesh)

            const intersects = raycaster.intersectObjects(visibleMeshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const data = hitMesh.userData;

                tooltip.style.display = 'block';
                tooltip.style.left = (event.clientX + 15) + 'px';
                tooltip.style.top = (event.clientY + 15) + 'px';
                tooltip.innerHTML = `
                    Ubicación: <b>${data.nombre_ubi || data.codigo}</b><br>
                    Estado: <b>${data.estado}</b><br>
                    Tipo de almacén: <b>${data.tipo_almacen}</b><br>
                    Tipo de ubicación: <b>${data.tipo_ubicacion}</b>
                `;
            } else {
                tooltip.style.display = 'none';
            }
        });

        document.getElementById('modeSelect').addEventListener('change', (e) => {
            const mode = e.target.value;
            
            rackMeshes.forEach(obj => {
                obj.mesh.material.color.setHex(getColor(obj.item, mode));
            });

            // Actualizar dinámicamente cantidades, porcentajes y leyenda
            actualizarLeyenda(mode);
        });

        function actualizarLeyenda(mode) {
            const legendContainer = document.getElementById('legend-container');
            
            const unicasMap = new Map();
            rawData.forEach(item => {
                if (!posicionesExcluidas.includes(item.nombre_ubi) && !unicasMap.has(item.nombre_ubi)) {
                    unicasMap.set(item.nombre_ubi, item);
                }
            });
            
            const totalUnicas = unicasMap.size;
            const conteos = {};
            
            unicasMap.forEach(item => {
                let clave = '';
                if (mode === 'ubicacion') clave = item.tipo_ubicacion;
                else if (mode === 'estado') clave = item.estado;
                else if (mode === 'almacen') clave = item.tipo_almacen;
                
                if (!conteos[clave]) conteos[clave] = 0;
                conteos[clave]++;
            });
            
            let configs = [];
            if (mode === 'ubicacion') {
                configs = [
                    { key: 'R1', color: '#3399ff' },
                    { key: 'R2', color: '#9933cc' },
                    { key: 'R3', color: '#ff3333' },
                    { key: 'R4', color: '#00b894' }
                ];
            } else if (mode === 'estado') {
                configs = [
                    { key: 'Ocupado', color: '#a66e36' },
                    { key: 'Libre', color: '#28a745' }
                ];
            } else if (mode === 'almacen') {
                configs = [
                    { key: 'PICK', color: '#ffc107' },
                    { key: 'REAP', color: '#17a2b8' },
                    { key: 'EST1', color: '#e74c3c' },
                    { key: 'PISO', color: '#2ecc71' },
                    { key: 'PLAY', color: '#9b59b6' },
                    { key: 'GRL1', color: '#e67e22' },
                    { key: 'GRL2', color: '#a85913' },
                    { key: 'GRL3', color: '#15a387' },
                    { key: 'SCRA', color: '#95a5a6' }
                ];
            }
            
            let html = '<h4>Referencias:</h4>';
            configs.forEach(cfg => {
                const cant = conteos[cfg.key] || 0;
                const porcentaje = totalUnicas > 0 ? ((cant / totalUnicas) * 100).toFixed(1) : '0.0';
                html += `
                    <div class="legend-item" style="justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
                        <div style="display: flex; align-items: center;">
                            <div class="color-box" style="background: ${cfg.color};"></div>
                            <span>${cfg.key}</span>
                        </div>
                        <span><b>${cant}</b> (${porcentaje}%)</span>
                    </div>
                `;
            });
            legendContainer.innerHTML = html;
        }

        // Llamar a la función al iniciar la página para mostrar los valores por defecto
        actualizarLeyenda('ubicacion');
